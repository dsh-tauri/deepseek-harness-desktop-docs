name: Sync releases

on:
  # Release 发布在 deepseek-harness-desktop，跨仓库不会被 `on: release` 命中，
  # 也不支持跨仓库 workflow_run，所以由那边的 release workflow 派发这个事件。
  # 派发需要 PAT 或 GitHub App token（默认 GITHUB_TOKEN 只能操作自己仓库），
  # 在 deepseek-harness-desktop 配置 secret：DOCS_DISPATCH_TOKEN。
  repository_dispatch:
    types: [desktop-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync-releases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the release snapshot from the GitHub releases page
        run: node scripts/sync-releases.mjs
      - name: Commit the refreshed snapshot
        run: |
          git add snippets/downloads.jsx
          if git diff --cached --quiet; then
            echo "Snapshot already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(downloads): sync release list from GitHub"
          git push
